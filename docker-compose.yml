services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-app
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - /app/.next
      - .:/app
      
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - CHOKIDAR_USEPOLLING=true  # Helps with file watching in Docker
    env_file:
      - .env
    restart: unless-stopped
    stdin_open: true  # Keep STDIN open for debugging
    tty: true         # Allocate pseudo-TTY
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge